<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>R&Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #0c0c0e;
  --bg-elevated: #16161a;
  --bg-hover: #1e1e24;
  --gold: #d4af37;
  --gold-light: #f0d878;
  --gold-dark: #a88b2a;
  --silver: #c0c0c0;
  --silver-light: #e8e8e8;
  --text: #f5f5f7;
  --text-muted: #a0a0a8;
  --border: #2a2a32;
  --radius: 12px;
  --shadow-gold: 0 0 20px rgba(212, 175, 55, 0.15);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  grid-template-rows: 1fr 90px;
  height: 100%;
}
.sidebar {
  background: linear-gradient(180deg, #121214 0%, #0c0c0e 100%);
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  grid-row: 1 / 3;
}
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; padding: 0 8px; }
.logo-icon {
  font-size: 28px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
}
.logo-text {
  font-size: 22px; font-weight: 700;
  background: linear-gradient(90deg, var(--gold-light), var(--silver-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 10px;
  color: var(--text-muted); text-decoration: none;
  font-weight: 500; font-size: 15px; transition: all 0.2s ease;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(212, 175, 55, 0.15), transparent);
  color: var(--gold-light); border-left: 3px solid var(--gold);
}
.nav-icon { font-size: 18px; width: 24px; text-align: center; }
.sidebar-footer { margin-top: auto; padding-top: 16px; }
.btn-add-music {
  width: 100%; padding: 12px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  border: none; border-radius: 10px; color: #0c0c0e;
  font-weight: 600; font-size: 14px; cursor: pointer;
  box-shadow: var(--shadow-gold);
}
.main {
  display: flex; flex-direction: column; overflow: hidden;
  background: radial-gradient(ellipse at top right, rgba(212, 175, 55, 0.05), transparent 50%);
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.search-bar input {
  width: 100%; max-width: 320px; padding: 11px 16px;
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 24px; color: var(--text); font-size: 14px; outline: none;
}
.search-bar input:focus { border-color: var(--gold); }
.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--silver));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #0c0c0e; font-size: 14px;
}
.content { flex: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
.section-title {
  font-size: 24px; font-weight: 700; margin-bottom: 6px;
  background: linear-gradient(90deg, var(--gold-light), var(--silver-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.section-subtitle { color: var(--text-muted); margin-bottom: 22px; font-size: 14px; }
.wave-banner {
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(192, 192, 192, 0.1));
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-radius: 16px; padding: 24px; margin-bottom: 24px;
  display: flex; align-items: center; gap: 16px; position: relative; overflow: hidden;
}
.wave-icon { font-size: 48px; filter: drop-shadow(0 0 16px rgba(212, 175, 55, 0.5)); z-index: 1; }
.wave-info { z-index: 1; }
.wave-info h2 { font-size: 20px; margin-bottom: 4px; }
.wave-info p { color: var(--text-muted); margin-bottom: 14px; font-size: 13px; }
.btn-wave {
  padding: 11px 22px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border: none; border-radius: 30px; color: #0c0c0e;
  font-weight: 600; font-size: 14px; cursor: pointer;
}
.tracks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 14px;
}
.track-card {
  background: var(--bg-elevated); border-radius: var(--radius);
  padding: 12px; cursor: pointer; transition: all 0.2s;
}
.track-card:active { transform: scale(0.97); }
.track-card .cover {
  width: 100%; aspect-ratio: 1; border-radius: 10px;
  background: linear-gradient(135deg, #2a2a32, #1a1a1e);
  margin-bottom: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 32px;
}
.track-card .title { font-weight: 600; font-size: 13px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-card .artist { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tracks-list { display: flex; flex-direction: column; gap: 2px; }
.track-row {
  display: grid; grid-template-columns: 32px 1fr auto;
  align-items: center; gap: 12px;
  padding: 12px 10px; border-radius: 8px; cursor: pointer;
}
.track-row:active { background: var(--bg-hover); }
.track-row .num { color: var(--text-muted); font-size: 13px; }
.track-row .row-title { font-weight: 500; font-size: 14px; }
.track-row .row-artist { color: var(--text-muted); font-size: 12px; display: block; }
.track-row .duration { color: var(--text-muted); font-size: 12px; }
.player {
  grid-column: 1 / 3;
  background: linear-gradient(180deg, #16161a, #121214);
  border-top: 1px solid var(--border);
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; padding: 10px 16px; gap: 12px;
}
.player-track { display: flex; align-items: center; gap: 12px; min-width: 0; }
.track-cover {
  width: 48px; height: 48px; border-radius: 8px;
  background: linear-gradient(135deg, var(--gold-dark), #333);
  display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
}
.track-info { min-width: 0; }
.track-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-artist { font-size: 12px; color: var(--text-muted); }
.like-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px; }
.like-btn.liked { color: var(--gold); }
.player-controls { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.controls-top { display: flex; align-items: center; gap: 14px; }
.ctrl-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 4px; }
.play-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--gold); color: #0c0c0e; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.4);
}
.progress { display: none; }
.player-extra { display: none; }
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  display: none; align-items: flex-end; justify-content: center; z-index: 100;
}
.modal.open { display: flex; }
.modal-content {
  background: var(--bg-elevated); border-radius: 20px 20px 0 0;
  padding: 24px 20px 32px; width: 100%; max-width: 480px;
  display: flex; flex-direction: column; gap: 12px;
}
.modal-content h2 {
  margin-bottom: 6px;
  background: linear-gradient(90deg, var(--gold-light), var(--silver));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.modal-content input {
  padding: 14px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 15px; outline: none;
}
.modal-actions { display: flex; gap: 10px; margin-top: 8px; }
.btn-cancel, .btn-confirm {
  flex: 1; padding: 14px; border-radius: 10px; font-weight: 600;
  cursor: pointer; border: none; font-size: 15px;
}
.btn-cancel { background: var(--bg-hover); color: var(--text); }
.btn-confirm { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: #0c0c0e; }
@media (max-width: 700px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto 70px; }
  .sidebar {
    grid-row: 2; grid-column: 1;
    flex-direction: row; padding: 8px 6px;
    border-right: none; border-top: 1px solid var(--border);
    overflow-x: auto; gap: 4px;
  }
  .logo, .sidebar-footer { display: none; }
  .nav { flex-direction: row; gap: 2px; width: 100%; justify-content: space-around; }
  .nav-item {
    flex-direction: column; gap: 2px; padding: 8px 10px;
    font-size: 10px; border-left: none !important;
  }
  .nav-item.active { background: rgba(212,175,55,0.12); border-radius: 10px; }
  .nav-icon { font-size: 18px; width: auto; }
  .player { grid-column: 1; grid-row: 3; }
  .header { padding: 12px 16px; }
  .search-bar { flex: 1; }
  .search-bar input { width: 100%; }
}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">♪</span>
        <span class="logo-text">R&Music</span>
      </div>
      <nav class="nav">
        <a href="#" class="nav-item active" data-section="home"><span class="nav-icon">⌂</span> Главная</a>
        <a href="#" class="nav-item" data-section="wave"><span class="nav-icon">✧</span> Волна</a>
        <a href="#" class="nav-item" data-section="collection"><span class="nav-icon">♥</span> Коллекция</a>
        <a href="#" class="nav-item" data-section="playlists"><span class="nav-icon">☰</span> Плейлисты</a>
        <a href="#" class="nav-item" data-section="search"><span class="nav-icon">⌕</span> Поиск</a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn-add-music" id="addMusicBtn">+ Добавить</button>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="search-bar" style="flex:1">
          <input type="text" id="searchInput" placeholder="Трек или исполнитель..." />
        </div>
        <div class="user" style="margin-left:12px"><div class="avatar">R</div></div>
      </header>
      <div class="content" id="content"></div>
    </main>

    <footer class="player" id="player">
      <div class="player-track">
        <div class="track-cover" id="playerCover"></div>
        <div class="track-info">
          <div class="track-title" id="playerTitle">Выбери трек</div>
          <div class="track-artist" id="playerArtist">—</div>
        </div>
        <button class="like-btn" id="likeBtn">♡</button>
      </div>
      <div class="player-controls">
        <div class="controls-top">
          <button class="ctrl-btn" id="prevBtn">⏮</button>
          <button class="ctrl-btn play-btn" id="playBtn">▶</button>
          <button class="ctrl-btn" id="nextBtn">⏭</button>
        </div>
      </div>
    </footer>
  </div>

  <div class="modal" id="addMusicModal">
    <div class="modal-content">
      <h2>Добавить трек</h2>
      <input type="text" id="newTitle" placeholder="Название трека" />
      <input type="text" id="newArtist" placeholder="Исполнитель" />
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelAdd">Отмена</button>
        <button class="btn-confirm" id="confirmAdd">Добавить</button>
      </div>
    </div>
  </div>

  <script>
const defaultTracks = [
  { id: 1, title: "Midnight Gold", artist: "Silver Echo", duration: 214, cover: null, liked: false },
  { id: 2, title: "Aurora", artist: "Neon Horizon", duration: 198, cover: null, liked: true },
  { id: 3, title: "Crystal Dreams", artist: "Luna Vale", duration: 245, cover: null, liked: false },
  { id: 4, title: "Golden Hour", artist: "Velvet Sky", duration: 187, cover: null, liked: false },
  { id: 5, title: "Silver Lining", artist: "Echo Park", duration: 223, cover: null, liked: true },
  { id: 6, title: "Starlight", artist: "Nova Bloom", duration: 201, cover: null, liked: false },
  { id: 7, title: "Ember", artist: "Ash & Gold", duration: 176, cover: null, liked: false },
  { id: 8, title: "Moonlit", artist: "Nightveil", duration: 256, cover: null, liked: true },
  { id: 9, title: "Radiance", artist: "Solar Flare", duration: 192, cover: null, liked: false },
  { id: 10, title: "Whisper", artist: "Soft Rain", duration: 231, cover: null, liked: false },
];
let tracks = JSON.parse(localStorage.getItem('rmusic_tracks')) || [...defaultTracks];
let currentTrackIndex = -1;
let isPlaying = false;
let progressInterval = null;
let currentTime = 0;

const content = document.getElementById('content');
const playerTitle = document.getElementById('playerTitle');
const playerArtist = document.getElementById('playerArtist');
const playerCover = document.getElementById('playerCover');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const likeBtn = document.getElementById('likeBtn');
const addMusicBtn = document.getElementById('addMusicBtn');
const addMusicModal = document.getElementById('addMusicModal');
const cancelAdd = document.getElementById('cancelAdd');
const confirmAdd = document.getElementById('confirmAdd');
const searchInput = document.getElementById('searchInput');

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + s.toString().padStart(2, '0');
}
function saveTracks() { localStorage.setItem('rmusic_tracks', JSON.stringify(tracks)); }
function getCoverEmoji(id) {
  const emojis = ['🎵','🎶','💎','✨','🌙','⭐','🔥','🌊','💜','🌟'];
  return emojis[id % emojis.length];
}

function renderHome() {
  content.innerHTML = `<h1 class="section-title">R&Music</h1>
    <p class="section-subtitle">Золото • Серебро • Музыка</p>
    <div class="wave-banner">
      <div class="wave-icon">✧</div>
      <div class="wave-info">
        <h2>Золотая Волна</h2>
        <p>Персональная подборка под твоё настроение</p>
        <button class="btn-wave" onclick="startWave()">Включить волну</button>
      </div>
    </div>
    <h2 style="margin-bottom:14px;font-size:17px">Рекомендации</h2>
    <div class="tracks-grid" id="homeGrid"></div>`;
  const grid = document.getElementById('homeGrid');
  tracks.slice(0, 8).forEach((t, i) => { grid.innerHTML += createTrackCard(t, i); });
}

function renderWave() {
  content.innerHTML = `<h1 class="section-title">✧ Золотая Волна</h1>
    <p class="section-subtitle">Бесконечный поток треков</p>
    <div class="wave-banner">
      <div class="wave-icon">✧</div>
      <div class="wave-info">
        <h2>Твоя Золотая Волна</h2>
        <p>Слушай без остановки</p>
        <button class="btn-wave" onclick="startWave()">▶ Запустить</button>
      </div>
    </div>
    <div class="tracks-list" id="waveList"></div>`;
  const list = document.getElementById('waveList');
  [...tracks].sort(() => Math.random() - 0.5).forEach((t, i) => {
    list.innerHTML += createTrackRow(t, tracks.indexOf(t));
  });
}

function renderCollection() {
  const liked = tracks.filter(t => t.liked);
  content.innerHTML = `<h1 class="section-title">Коллекция</h1>
    <p class="section-subtitle">Твои любимые треки</p>
    <div class="tracks-list" id="collectionList"></div>`;
  const list = document.getElementById('collectionList');
  if (!liked.length) list.innerHTML = '<p style="color:var(--text-muted);padding:16px 0">Пока пусто. Нажми ♡ на треке</p>';
  else liked.forEach(t => list.innerHTML += createTrackRow(t, tracks.indexOf(t)));
}

function renderPlaylists() {
  content.innerHTML = `<h1 class="section-title">Плейлисты</h1>
    <p class="section-subtitle">Твои подборки</p>
    <div class="tracks-grid">
      <div class="track-card" onclick="alert('Скоро можно будет создавать')">
        <div class="cover" style="background:linear-gradient(135deg,#d4af37,#a88b2a)">+</div>
        <div class="title">Создать плейлист</div>
      </div>
      <div class="track-card">
        <div class="cover">💎</div>
        <div class="title">Золотая коллекция</div>
        <div class="artist">${tracks.length} треков</div>
      </div>
    </div>`;
}

function renderSearch(query = '') {
  const filtered = query
    ? tracks.filter(t => t.title.toLowerCase().includes(query.toLowerCase()) || t.artist.toLowerCase().includes(query.toLowerCase()))
    : tracks;
  content.innerHTML = `<h1 class="section-title">Поиск</h1>
    <p class="section-subtitle">${query ? 'Результаты по «' + query + '»' : 'Найди свой трек'}</p>
    <div class="tracks-list" id="searchList"></div>`;
  const list = document.getElementById('searchList');
  if (!filtered.length) list.innerHTML = '<p style="color:var(--text-muted)">Ничего не найдено</p>';
  else filtered.forEach(t => list.innerHTML += createTrackRow(t, tracks.indexOf(t)));
}

function createTrackCard(t, index) {
  return `<div class="track-card" onclick="playTrack(${index})">
    <div class="cover">${getCoverEmoji(t.id)}</div>
    <div class="title">${t.title}</div>
    <div class="artist">${t.artist}</div>
  </div>`;
}
function createTrackRow(t, index) {
  return `<div class="track-row" onclick="playTrack(${index})">
    <span class="num">${index + 1}</span>
    <div><span class="row-title">${t.title}</span><span class="row-artist">${t.artist}</span></div>
    <span class="duration">${formatTime(t.duration)}</span>
  </div>`;
}

function playTrack(index) {
  if (index < 0 || index >= tracks.length) return;
  currentTrackIndex = index;
  const t = tracks[index];
  playerTitle.textContent = t.title;
  playerArtist.textContent = t.artist;
  playerCover.textContent = getCoverEmoji(t.id);
  likeBtn.textContent = t.liked ? '♥' : '♡';
  likeBtn.classList.toggle('liked', t.liked);
  isPlaying = true;
  playBtn.textContent = '⏸';
  currentTime = 0;
  startProgress();
}
function togglePlay() {
  if (currentTrackIndex === -1) { playTrack(0); return; }
  isPlaying = !isPlaying;
  playBtn.textContent = isPlaying ? '⏸' : '▶';
  if (isPlaying) startProgress(); else clearInterval(progressInterval);
}
function startProgress() {
  clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    if (!isPlaying) return;
    currentTime += 1;
    if (currentTime >= tracks[currentTrackIndex].duration) nextTrack();
  }, 1000);
}
function nextTrack() {
  if (currentTrackIndex === -1) return;
  playTrack((currentTrackIndex + 1) % tracks.length);
}
function prevTrack() {
  if (currentTrackIndex === -1) return;
  playTrack((currentTrackIndex - 1 + tracks.length) % tracks.length);
}
function startWave() {
  playTrack(Math.floor(Math.random() * tracks.length));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('[data-section="wave"]').classList.add('active');
  renderWave();
}
function toggleLike() {
  if (currentTrackIndex === -1) return;
  const t = tracks[currentTrackIndex];
  t.liked = !t.liked;
  likeBtn.textContent = t.liked ? '♥' : '♡';
  likeBtn.classList.toggle('liked', t.liked);
  saveTracks();
}

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    const s = item.dataset.section;
    if (s === 'home') renderHome();
    else if (s === 'wave') renderWave();
    else if (s === 'collection') renderCollection();
    else if (s === 'playlists') renderPlaylists();
    else if (s === 'search') renderSearch();
  });
});

playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', prevTrack);
nextBtn.addEventListener('click', nextTrack);
likeBtn.addEventListener('click', toggleLike);
searchInput.addEventListener('input', e => {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('[data-section="search"]').classList.add('active');
  renderSearch(e.target.value.trim());
});
addMusicBtn.addEventListener('click', () => addMusicModal.classList.add('open'));
cancelAdd.addEventListener('click', () => addMusicModal.classList.remove('open'));
confirmAdd.addEventListener('click', () => {
  const title = document.getElementById('newTitle').value.trim();
  const artist = document.getElementById('newArtist').value.trim();
  if (!title || !artist) { alert('Заполни название и исполнителя'); return; }
  tracks.unshift({ id: Date.now(), title, artist, duration: 180 + Math.floor(Math.random()*120), cover: null, liked: false });
  saveTracks();
  addMusicModal.classList.remove('open');
  document.getElementById('newTitle').value = '';
  document.getElementById('newArtist').value = '';
  const active = document.querySelector('.nav-item.active');
  if (active) active.click();
});

renderHome();
  </script>
</body>
</html>
