<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>R&Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #fff; --bg2: #f5f5f7; --text: #1a1a1a; --text2: #8e8e93;
  --gold: #c9a227; --gold2: #e8c547; --border: #ebebeb; --player: #f8f8fa;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family: Inter, -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; height:100dvh; overflow:hidden; }
.app { display:flex; flex-direction:column; height:100%; max-width:480px; margin:0 auto; position:relative; background:var(--bg); }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 8px; }
.topbar h1 { font-size:17px; font-weight:600; text-align:center; flex:1; }
.icon-btn { width:36px; height:36px; border:none; background:none; font-size:20px; cursor:pointer; }
.content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:140px; }
.cats { display:flex; gap:20px; padding:8px 16px 20px; overflow-x:auto; }
.cat { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:64px; cursor:pointer; }
.cat-icon { width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:26px; }
.cat span { font-size:12px; font-weight:500; }
.section { padding:0 16px 24px; }
.section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.section-head h2 { font-size:20px; font-weight:700; }
.h-scroll { display:flex; gap:12px; overflow-x:auto; margin:0 -16px; padding:0 16px; }
.playlist-card { min-width:140px; max-width:140px; cursor:pointer; }
.playlist-card .cover { width:140px; height:140px; border-radius:12px; overflow:hidden; margin-bottom:8px; background:#eee; }
.playlist-card .cover img { width:100%; height:100%; object-fit:cover; }
.playlist-card .title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.playlist-card .sub { font-size:12px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.promo { margin:0 16px 24px; background:linear-gradient(135deg,#1a1a2e,#2d1b4e); border-radius:16px; padding:20px; display:flex; align-items:center; gap:16px; color:#fff; }
.promo-text h3 { font-size:18px; font-weight:700; margin-bottom:6px; line-height:1.25; }
.promo-text p { font-size:13px; opacity:.85; margin-bottom:14px; }
.promo-btn { background:var(--gold2); color:#1a1a1a; border:none; border-radius:20px; padding:10px 20px; font-weight:600; font-size:14px; cursor:pointer; }
.promo-art { width:90px; height:90px; flex-shrink:0; border-radius:12px; background:linear-gradient(135deg,var(--gold),#6b4c9a); display:flex; align-items:center; justify-content:center; font-size:40px; }
.track-item { display:flex; align-items:center; gap:12px; padding:10px 0; cursor:pointer; }
.track-item .t-cover { width:48px; height:48px; border-radius:8px; object-fit:cover; background:#eee; flex-shrink:0; }
.track-item .t-info { flex:1; min-width:0; }
.track-item .t-title { font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.track-item .t-artist { font-size:13px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wave-screen { position:absolute; inset:0; z-index:50; background:#0a0a0c; display:none; flex-direction:column; color:#fff; }
.wave-screen.open { display:flex; }
.wave-bg { position:absolute; inset:0; background: radial-gradient(ellipse at 30% 20%,rgba(201,162,39,.35),transparent 50%), radial-gradient(ellipse at 70% 60%,rgba(168,100,200,.3),transparent 50%), radial-gradient(ellipse at 40% 80%,rgba(80,120,200,.25),transparent 40%); filter:blur(40px); }
.wave-content { position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px 120px; text-align:center; }
.wave-logo { font-size:14px; font-weight:600; letter-spacing:1px; color:var(--gold2); margin-bottom:32px; }
.wave-title { font-size:36px; font-weight:800; margin-bottom:28px; }
.wave-play { width:72px; height:72px; border-radius:50%; background:var(--gold2); border:none; font-size:28px; color:#1a1a1a; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-bottom:28px; box-shadow:0 8px 32px rgba(201,162,39,.4); }
.wave-now { background:rgba(255,255,255,.12); border-radius:24px; padding:10px 18px; font-size:13px; max-width:90%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wave-close { position:absolute; top:16px; left:16px; z-index:3; background:rgba(255,255,255,.15); border:none; width:36px; height:36px; border-radius:50%; color:#fff; font-size:18px; cursor:pointer; }
.mini-player { position:absolute; bottom:56px; left:8px; right:8px; background:var(--player); border-radius:14px; display:none; align-items:center; gap:10px; padding:8px 12px; box-shadow:0 4px 20px rgba(0,0,0,.08); z-index:30; }
.mini-player.show { display:flex; }
.mp-cover { width:40px; height:40px; border-radius:8px; object-fit:cover; background:#ddd; flex-shrink:0; }
.mp-info { flex:1; min-width:0; }
.mp-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mp-artist { font-size:11px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mp-btn { background:none; border:none; font-size:22px; color:var(--text); cursor:pointer; padding:4px; }
.mp-btn.liked { color:#ff3b5c; }
.tabbar { position:absolute; bottom:0; left:0; right:0; height:56px; background:rgba(255,255,255,.92); backdrop-filter:blur(20px); border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-around; z-index:40; }
.tab { display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; cursor:pointer; color:var(--text2); font-size:10px; font-weight:500; padding:6px 12px; }
.tab.active { color:var(--gold); }
.tab-icon { font-size:22px; }
.big-heart { font-size:64px; text-align:center; margin:24px 0 12px; }
.collection-title { text-align:center; font-size:18px; font-weight:600; }
.collection-sub { text-align:center; font-size:13px; color:var(--text2); margin-bottom:28px; }
.liked-row { display:flex; align-items:center; gap:14px; padding:12px 16px; }
.heart-icon { width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg,#ff6b8a,#ff3b5c); display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; }
.profile-avatar { width:88px; height:88px; border-radius:50%; background:linear-gradient(135deg,var(--gold),#a8a8b0); margin:24px auto 12px; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:#fff; }
.profile-name { text-align:center; font-size:22px; font-weight:700; }
.profile-sub { text-align:center; font-size:13px; color:var(--text2); margin-bottom:28px; }
.menu-item { display:flex; justify-content:space-between; padding:16px; border-bottom:1px solid var(--border); font-size:16px; }
  </style>
</head>
<body>
<div class="app">
  <div class="content" id="content"></div>

  <div class="mini-player" id="miniPlayer">
    <img class="mp-cover" id="mpCover" alt="">
    <div class="mp-info">
      <div class="mp-title" id="mpTitle">—</div>
      <div class="mp-artist" id="mpArtist">—</div>
    </div>
    <button class="mp-btn" id="mpLike">♡</button>
    <button class="mp-btn" id="mpPlay">▶</button>
  </div>

  <div class="tabbar">
    <button class="tab active" data-tab="home"><span class="tab-icon">✦</span>Главная</button>
    <button class="tab" data-tab="wave"><span class="tab-icon">♪</span>Волна</button>
    <button class="tab" data-tab="collection"><span class="tab-icon">♡</span>Коллекция</button>
    <button class="tab" data-tab="profile"><span class="tab-icon">☺</span>Профиль</button>
  </div>

  <div class="wave-screen" id="waveScreen">
    <div class="wave-bg"></div>
    <button class="wave-close" id="waveClose">←</button>
    <div class="wave-content">
      <div class="wave-logo">R&MUSIC</div>
      <div class="wave-title">Золотая Волна</div>
      <button class="wave-play" id="wavePlayBtn">▶</button>
      <div class="wave-now" id="waveNow">Нажми play и слушай</div>
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
// Встроенные бесплатные треки (работают без API)

:"Alegend","duration":126,"cover":"https://eu.data.freetouse.com/music/tracks/67e80b77-8bf2-4475-866b-eab66c48b178/cover/webp/md/cover-md.webp","url":"https://eu.data.freetouse.com/music/tracks/67e80b77-8bf2-4475-866b-eab66c48b178/file/mp3/file.mp3"},{"id":"c5d1d8fb-81b7-4965-b8e0-4106e31983b5","title":"Coral Reef","artist":"Aetheric","duration":141,"cover":"https://eu.data.freetouse.com/music/tracks/c5d1d8fb-81b7-4965-b8e0-4106e31983b5/cover/webp/md/cover-md.webp","url":"https://eu.data.freetouse.com/music/tracks/c5d1d8fb-81b7-4965-b8e0-4106e31983b5/file/mp3/file.mp3"},{"id":"ecc715e6-b16a-2412-2f6b-c2086a505835","title":"Beautiful Liar","artist":"AgusAlvarez","duration":219,"cover":"https://eu.data.freetouse.com/music/tracks/ecc715e6-b16a-2412-2f6b-c2086a505835/cover/webp/md/cover-md.webp","url":"https://eu.data.freetouse.com/music/tracks/ecc715e6-b16a-2412-2f6b-c2086a505835/file/mp3/file.mp3"},{"id":"f67fd291-a51f-4b23-b4fa-1130871ec892","title":"thoughts","artist":"massobeats","duration":157,"cover":"https://eu.data.freetouse.com/music/tracks/f67fd291-a51f-4b23-b4fa-1130871ec892/cover/webp/md/cover-md.webp","url":"https://eu.data.freetouse.com/music/tracks/f67fd291-a51f-4b23-b4fa-1130871ec892/file/mp3/file.mp3"}];

let currentIndex = -1;
let isPlaying = false;
let liked = JSON.parse(localStorage.getItem('rmusic_liked') || '[]');

const content = document.getElementById('content');
const audio = document.getElementById('audio');
const miniPlayer = document.getElementById('miniPlayer');
const mpCover = document.getElementById('mpCover');
const mpTitle = document.getElementById('mpTitle');
const mpArtist = document.getElementById('mpArtist');
const mpPlay = document.getElementById('mpPlay');
const mpLike = document.getElementById('mpLike');
const waveScreen = document.getElementById('waveScreen');
const waveNow = document.getElementById('waveNow');
const wavePlayBtn = document.getElementById('wavePlayBtn');

function renderHome() {
  content.innerHTML = `
    <div class="topbar"><div style="width:36px"></div><h1>Что послушать</h1><button class="icon-btn">⌕</button></div>
    <div class="cats">
      <div class="cat" onclick="startWave()"><div class="cat-icon" style="background:linear-gradient(135deg,#f5d76e,#c9a227)">⚡</div><span>Волна</span></div>
      <div class="cat"><div class="cat-icon" style="background:linear-gradient(135deg,#a8c0ff,#6b8cff)">📚</div><span>Книги</span></div>
      <div class="cat"><div class="cat-icon" style="background:linear-gradient(135deg,#ffb347,#ff8c42)">🧸</div><span>Детям</span></div>
      <div class="cat"><div class="cat-icon" style="background:linear-gradient(135deg,#7dcea0,#27ae60)">🎙️</div><span>Подкасты</span></div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Мне нравится</h2></div>
      <div class="h-scroll" id="likedScroll"></div>
    </div>
    <div class="promo">
      <div class="promo-text"><h3>Золотая Волна<br>ждёт тебя</h3><p>Персональный поток под настроение</p><button class="promo-btn" onclick="startWave()">Поехали</button></div>
      <div class="promo-art">✧</div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Рекомендации</h2></div>
      <div class="h-scroll" id="recScroll"></div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Треки</h2></div>
      <div id="trackList"></div>
    </div>`;

  const likedTracks = tracks.filter(t => liked.includes(t.id));
  const ls = document.getElementById('likedScroll');
  if (likedTracks.length) {
    likedTracks.forEach(t => {
      const i = tracks.indexOf(t);
      ls.innerHTML += `<div class="playlist-card" onclick="playTrack(${i})"><div class="cover"><img src="${t.cover}" onerror="this.style.display='none'"></div><div class="title">${t.title}</div><div class="sub">${t.artist}</div></div>`;
    });
  } else ls.innerHTML = '<div style="color:var(--text2);padding:16px 0;font-size:14px">Лайкай треки ♡</div>';

  const rec = document.getElementById('recScroll');
  tracks.slice(0, 10).forEach((t, i) => {
    rec.innerHTML += `<div class="playlist-card" onclick="playTrack(${i})"><div class="cover"><img src="${t.cover}" loading="lazy" onerror="this.style.display='none'"></div><div class="title">${t.title}</div><div class="sub">${t.artist}</div></div>`;
  });

  const list = document.getElementById('trackList');
  tracks.forEach((t, i) => {
    list.innerHTML += `<div class="track-item" onclick="playTrack(${i})"><img class="t-cover" src="${t.cover}" onerror="this.src=''"><div class="t-info"><div class="t-title">${t.title}</div><div class="t-artist">${t.artist}</div></div></div>`;
  });
}

function renderCollection() {
  const likedTracks = tracks.filter(t => liked.includes(t.id));
  content.innerHTML = `
    <div class="topbar"><button class="icon-btn">☺</button><h1>Коллекция</h1><button class="icon-btn">⌕</button></div>
    <div class="big-heart">💜</div>
    <div class="collection-title">Моя волна по коллекции</div>
    <div class="collection-sub">У вашей музыки есть цвет</div>
    <div class="liked-row"><div class="heart-icon">♥</div><div><h3 style="font-size:16px;font-weight:600">Мне нравится</h3><p style="font-size:13px;color:var(--text2)">${likedTracks.length} треков</p></div></div>
    <div style="padding:0 16px">
      ${likedTracks.length ? likedTracks.map(t => {
        const i = tracks.indexOf(t);
        return `<div class="track-item" onclick="playTrack(${i})"><img class="t-cover" src="${t.cover}"><div class="t-info"><div class="t-title">${t.title}</div><div class="t-artist">${t.artist}</div></div></div>`;
      }).join('') : '<p style="text-align:center;color:var(--text2);padding:30px">Пока пусто</p>'}
    </div>`;
}

function renderProfile() {
  content.innerHTML = `
    <div class="topbar"><button class="icon-btn">←</button><h1>Профиль</h1><div style="width:36px"></div></div>
    <div class="profile-avatar">R</div>
    <div class="profile-name">ravilrrrrrrr</div>
    <div class="profile-sub">R&Music</div>
    <div class="menu-item"><span>Управлять подпиской</span><span>›</span></div>
    <div class="menu-item"><span>Настройки</span><span>›</span></div>
    <div class="menu-item"><span>О приложении</span><span>›</span></div>`;
}

function playTrack(i) {
  if (i < 0 || i >= tracks.length) return;
  currentIndex = i;
  const t = tracks[i];
  mpTitle.textContent = t.title;
  mpArtist.textContent = t.artist;
  mpCover.src = t.cover;
  miniPlayer.classList.add('show');
  mpLike.textContent = liked.includes(t.id) ? '♥' : '♡';
  mpLike.classList.toggle('liked', liked.includes(t.id));
  waveNow.textContent = t.artist + ' — ' + t.title;
  audio.src = t.url;
  audio.play().then(() => {
    isPlaying = true;
    mpPlay.textContent = '⏸';
    wavePlayBtn.textContent = '⏸';
  }).catch(e => console.log('play error', e));
}

function togglePlay() {
  if (currentIndex < 0) { playTrack(0); return; }
  if (isPlaying) {
    audio.pause(); isPlaying = false;
    mpPlay.textContent = '▶'; wavePlayBtn.textContent = '▶';
  } else {
    audio.play(); isPlaying = true;
    mpPlay.textContent = '⏸'; wavePlayBtn.textContent = '⏸';
  }
}

function startWave() {
  waveScreen.classList.add('open');
  playTrack(Math.floor(Math.random() * tracks.length));
}

function toggleLike() {
  if (currentIndex < 0) return;
  const id = tracks[currentIndex].id;
  if (liked.includes(id)) liked = liked.filter(x => x !== id);
  else liked.push(id);
  localStorage.setItem('rmusic_liked', JSON.stringify(liked));
  mpLike.textContent = liked.includes(id) ? '♥' : '♡';
  mpLike.classList.toggle('liked', liked.includes(id));
}

audio.addEventListener('ended', () => playTrack((currentIndex + 1) % tracks.length));
mpPlay.onclick = e => { e.stopPropagation(); togglePlay(); };
mpLike.onclick = e => { e.stopPropagation(); toggleLike(); };
wavePlayBtn.onclick = togglePlay;
document.getElementById('waveClose').onclick = () => waveScreen.classList.remove('open');

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const n = tab.dataset.tab;
    if (n === 'home') renderHome();
    else if (n === 'wave') startWave();
    else if (n === 'collection') renderCollection();
    else if (n === 'profile') renderProfile();
  };
});

renderHome();
</script>
</body>
</html>
