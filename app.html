<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>R&Music</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff;
  --text: #000;
  --muted: #8e8e93;
  --gold: #fcca00;
  --gold-dark: #e6b800;
  --line: #f0f0f0;
  --player-bg: #f2f2f7;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #000;
  color: var(--text);
  height: 100vh; height: 100dvh;
  display: flex; justify-content: center;
}
.app {
  width: 100%; max-width: 430px;
  height: 100%;
  background: var(--bg);
  position: relative;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* ===== CONTENT ===== */
.screen {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 130px;
}

/* Header */
.hdr {
  padding: 14px 16px 10px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--bg); z-index: 10;
}
.hdr h1 { font-size: 17px; font-weight: 600; flex: 1; text-align: center; }
.hdr-btn {
  width: 32px; height: 32px; border: none; background: none;
  font-size: 18px; color: var(--text); cursor: pointer;
}

/* Categories */
.cats {
  display: flex; gap: 18px;
  padding: 6px 16px 22px;
  overflow-x: auto;
}
.cat {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  min-width: 62px; cursor: pointer;
}
.cat-ico {
  width: 58px; height: 58px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
}
.cat span { font-size: 12px; font-weight: 500; }

/* Sections */
.sec { padding: 0 16px 26px; }
.sec-title {
  font-size: 22px; font-weight: 700;
  margin-bottom: 14px;
}

/* Horizontal cards */
.row {
  display: flex; gap: 12px;
  overflow-x: auto;
  margin: 0 -16px; padding: 0 16px 4px;
}
.card {
  width: 136px; flex-shrink: 0; cursor: pointer;
}
.card-img {
  width: 136px; height: 136px; border-radius: 12px;
  overflow: hidden; background: #e8e8ed; margin-bottom: 8px;
  position: relative;
}
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-title {
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-sub {
  font-size: 12px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Promo */
.banner {
  margin: 0 16px 26px;
  background: linear-gradient(135deg, #1c1c2e 0%, #3a1f5c 100%);
  border-radius: 18px;
  padding: 22px 20px;
  display: flex; align-items: center; gap: 14px;
  color: #fff;
}
.banner h3 { font-size: 19px; font-weight: 700; line-height: 1.25; margin-bottom: 6px; }
.banner p { font-size: 13px; opacity: 0.8; margin-bottom: 14px; }
.banner-btn {
  background: var(--gold);
  color: #000;
  border: none;
  border-radius: 22px;
  padding: 10px 22px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
}
.banner-art {
  width: 84px; height: 84px; border-radius: 14px; flex-shrink: 0;
  background: linear-gradient(135deg, #fcca00, #9b59b6);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}

/* Track rows */
.trow {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0;
  cursor: pointer;
}
.trow img {
  width: 48px; height: 48px; border-radius: 8px;
  object-fit: cover; background: #e8e8ed; flex-shrink: 0;
}
.trow .info { flex: 1; min-width: 0; }
.trow .name {
  font-size: 15px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.trow .art {
  font-size: 13px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ===== WAVE (immersive) ===== */
.wave {
  position: absolute; inset: 0; z-index: 60;
  background: #0d0d12;
  display: none; flex-direction: column;
  color: #fff;
}
.wave.on { display: flex; }
.wave-glow {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(252,202,0,0.4), transparent),
    radial-gradient(ellipse 60% 40% at 80% 70%, rgba(155,89,182,0.35), transparent),
    radial-gradient(ellipse 50% 40% at 20% 80%, rgba(52,152,219,0.25), transparent);
}
.wave-ui {
  position: relative; z-index: 2;
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px;
  text-align: center;
}
.wave-back {
  position: absolute; top: 16px; left: 16px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.12); border: none;
  color: #fff; font-size: 18px; cursor: pointer;
}
.wave-brand {
  font-size: 13px; font-weight: 600; letter-spacing: 1.5px;
  color: var(--gold); margin-bottom: 20px;
}
.wave-h1 {
  font-size: 34px; font-weight: 800;
  margin-bottom: 36px; letter-spacing: -0.5px;
}
.wave-btn {
  width: 76px; height: 76px; border-radius: 50%;
  background: var(--gold); border: none;
  font-size: 30px; color: #000;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 10px 40px rgba(252,202,0,0.45);
  margin-bottom: 28px;
}
.wave-track {
  background: rgba(255,255,255,0.12);
  border-radius: 24px;
  padding: 10px 20px;
  font-size: 13px;
  max-width: 85%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ===== MINI PLAYER ===== */
.player {
  position: absolute;
  left: 8px; right: 8px; bottom: 58px;
  height: 56px;
  background: var(--player-bg);
  border-radius: 14px;
  display: none; align-items: center; gap: 10px;
  padding: 0 10px 0 8px;
  z-index: 40;
  box-shadow: 0 2px 16px rgba(0,0,0,0.08);
}
.player.show { display: flex; }
.player img {
  width: 40px; height: 40px; border-radius: 8px;
  object-fit: cover; background: #ddd; flex-shrink: 0;
}
.player .pi { flex: 1; min-width: 0; }
.player .pt {
  font-size: 13px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player .pa {
  font-size: 11px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pbtn {
  width: 36px; height: 36px; border: none; background: none;
  font-size: 20px; cursor: pointer; color: var(--text);
  display: flex; align-items: center; justify-content: center;
}
.pbtn.liked { color: #ff2d55; }

/* ===== TAB BAR ===== */
.tabs {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 52px;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(16px);
  border-top: 0.5px solid var(--line);
  display: flex; align-items: stretch;
  z-index: 50;
}
.tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  border: none; background: none; cursor: pointer;
  color: #8e8e93; font-size: 10px; font-weight: 500;
}
.tab.on { color: var(--gold-dark); }
.tab svg { width: 24px; height: 24px; }

/* Collection */
.col-heart {
  font-size: 72px; text-align: center;
  margin: 28px 0 10px;
  filter: drop-shadow(0 6px 16px rgba(180,80,220,0.35));
}
.col-title { text-align: center; font-size: 18px; font-weight: 600; }
.col-sub { text-align: center; font-size: 13px; color: var(--muted); margin: 4px 0 28px; }
.like-block {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px; margin-bottom: 8px;
}
.like-ico {
  width: 50px; height: 50px; border-radius: 12px;
  background: linear-gradient(135deg, #ff6b8a, #ff2d55);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: #fff;
}

/* Profile */
.av {
  width: 90px; height: 90px; border-radius: 50%;
  background: linear-gradient(135deg, #fcca00, #b0b0b8);
  margin: 28px auto 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 38px; font-weight: 700; color: #fff;
}
.pname { text-align: center; font-size: 22px; font-weight: 700; }
.psub { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 32px; }
.mitem {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 16px;
  border-bottom: 0.5px solid var(--line);
  font-size: 16px;
}
.mitem span:last-child { color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <div class="screen" id="screen"></div>

  <div class="player" id="player">
    <img id="pCover" alt="">
    <div class="pi">
      <div class="pt" id="pTitle">—</div>
      <div class="pa" id="pArtist">—</div>
    </div>
    <button class="pbtn" id="pLike">♡</button>
    <button class="pbtn" id="pPlay">▶</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="home">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 9.5V21h7v-6h6v6h7V9.5L12 2z"/></svg>
      Главная
    </button>
    <button class="tab" data-t="wave">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v18M8 7v10M4 10v4M16 7v10M20 10v4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      Волна
    </button>
    <button class="tab" data-t="col">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-9.5-8.5C.5 9 3 5 6.5 5c2 0 3.5 1.2 4.5 2.5C12 6.2 13.5 5 15.5 5 19 5 21.5 9 21.5 12.5 19 16.5 12 21 12 21z"/></svg>
      Коллекция
    </button>
    <button class="tab" data-t="prof">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Профиль
    </button>
  </div>

  <div class="wave" id="wave">
    <div class="wave-glow"></div>
    <button class="wave-back" id="waveBack">←</button>
    <div class="wave-ui">
      <div class="wave-brand">R&MUSIC</div>
      <div class="wave-h1">Золотая Волна</div>
      <button class="wave-btn" id="waveBtn">▶</button>
      <div class="wave-track" id="waveTrack">Нажми play</div>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const tracks = [
  {id:"1",title:"Deja Vu",artist:"Aeris",cover:"https://eu.data.freetouse.com/music/tracks/427181eb-a1a4-4983-bde3-9d08abb7f768/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/427181eb-a1a4-4983-bde3-9d08abb7f768/file/mp3/file.mp3"},
  {id:"2",title:"Bloom",artist:"Nebulite",cover:"https://eu.data.freetouse.com/music/tracks/f78ea6a2-1063-654f-ddff-a052198609a2/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/f78ea6a2-1063-654f-ddff-a052198609a2/file/mp3/file.mp3"},
  {id:"3",title:"Back To Synthwave",artist:"Nebulite",cover:"https://eu.data.freetouse.com/music/tracks/40973ee4-4486-4513-9046-09d2749642b4/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/40973ee4-4486-4513-9046-09d2749642b4/file/mp3/file.mp3"},
  {id:"4",title:"Stellar",artist:"Aventure",cover:"https://eu.data.freetouse.com/music/tracks/7d57ea7a-85a8-4f71-97c8-7b777eaa02f6/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/7d57ea7a-85a8-4f71-97c8-7b777eaa02f6/file/mp3/file.mp3"},
  {id:"5",title:"At Ease",artist:"Hazelwood",cover:"https://eu.data.freetouse.com/music/tracks/ba1fa94b-1d39-7b71-7fc1-63ef5c30f357/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/ba1fa94b-1d39-7b71-7fc1-63ef5c30f357/file/mp3/file.mp3"},
  {id:"6",title:"This Is For You",artist:"Lukrembo",cover:"https://eu.data.freetouse.com/music/tracks/f58126e1-6516-192a-8a96-c8145fb11d6f/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/f58126e1-6516-192a-8a96-c8145fb11d6f/file/mp3/file.mp3"},
  {id:"7",title:"Stadium Rock",artist:"Pufino",cover:"https://eu.data.freetouse.com/music/tracks/6aba646c-9e36-7145-ad6a-157dbadf2778/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/6aba646c-9e36-7145-ad6a-157dbadf2778/file/mp3/file.mp3"},
  {id:"8",title:"Night Drive",artist:"Nebulite",cover:"https://eu.data.freetouse.com/music/tracks/e5756d36-197a-46f7-aed5-afa6ae9eab26/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/e5756d36-197a-46f7-aed5-afa6ae9eab26/file/mp3/file.mp3"},
  {id:"9",title:"Remain",artist:"Alegend",cover:"https://eu.data.freetouse.com/music/tracks/1c628317-05c3-4257-b4ce-a9d67a1d0440/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/1c628317-05c3-4257-b4ce-a9d67a1d0440/file/mp3/file.mp3"},
  {id:"10",title:"honey jam",artist:"massobeats",cover:"https://eu.data.freetouse.com/music/tracks/f5096754-4ce7-f995-4ce8-25daef51ade9/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/f5096754-4ce7-f995-4ce8-25daef51ade9/file/mp3/file.mp3"},
  {id:"11",title:"Silhouette",artist:"Moavii",cover:"https://eu.data.freetouse.com/music/tracks/86726550-723d-402a-bf16-cf497f7f45bf/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/86726550-723d-402a-bf16-cf497f7f45bf/file/mp3/file.mp3"},
  {id:"12",title:"Wings of Freedom",artist:"Alegend",cover:"https://eu.data.freetouse.com/music/tracks/67e80b77-8bf2-4475-866b-eab66c48b178/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/67e80b77-8bf2-4475-866b-eab66c48b178/file/mp3/file.mp3"},
  {id:"13",title:"Coral Reef",artist:"Aetheric",cover:"https://eu.data.freetouse.com/music/tracks/c5d1d8fb-81b7-4965-b8e0-4106e31983b5/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/c5d1d8fb-81b7-4965-b8e0-4106e31983b5/file/mp3/file.mp3"},
  {id:"14",title:"Beautiful Liar",artist:"AgusAlvarez",cover:"https://eu.data.freetouse.com/music/tracks/ecc715e6-b16a-2412-2f6b-c2086a505835/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/ecc715e6-b16a-2412-2f6b-c2086a505835/file/mp3/file.mp3"},
  {id:"15",title:"thoughts",artist:"massobeats",cover:"https://eu.data.freetouse.com/music/tracks/f67fd291-a51f-4b23-b4fa-1130871ec892/cover/webp/md/cover-md.webp",url:"https://eu.data.freetouse.com/music/tracks/f67fd291-a51f-4b23-b4fa-1130871ec892/file/mp3/file.mp3"}
];

let idx = -1, playing = false;
let liked = JSON.parse(localStorage.getItem('rm_liked')||'[]');

const screen = document.getElementById('screen');
const audio = document.getElementById('audio');
const player = document.getElementById('player');
const pCover = document.getElementById('pCover');
const pTitle = document.getElementById('pTitle');
const pArtist = document.getElementById('pArtist');
const pPlay = document.getElementById('pPlay');
const pLike = document.getElementById('pLike');
const wave = document.getElementById('wave');
const waveBtn = document.getElementById('waveBtn');
const waveTrack = document.getElementById('waveTrack');

function home() {
  const likedT = tracks.filter(t => liked.includes(t.id));
  screen.innerHTML = `
    <div class="hdr"><div style="width:32px"></div><h1>Что послушать</h1><button class="hdr-btn">⌕</button></div>
    <div class="cats">
      <div class="cat" onclick="openWave()"><div class="cat-ico" style="background:linear-gradient(145deg,#ffe566,#fcca00)">⚡</div><span>Волна</span></div>
      <div class="cat"><div class="cat-ico" style="background:linear-gradient(145deg,#b8d0ff,#6b9aff)">📚</div><span>Книги</span></div>
      <div class="cat"><div class="cat-ico" style="background:linear-gradient(145deg,#ffc78a,#ff9a4d)">🧸</div><span>Детям</span></div>
      <div class="cat"><div class="cat-ico" style="background:linear-gradient(145deg,#9eebc0,#3dd68c)">🎙️</div><span>Подкасты</span></div>
    </div>
    <div class="sec">
      <div class="sec-title">Мне нравится</div>
      <div class="row" id="likedRow"></div>
    </div>
    <div class="banner">
      <div style="flex:1">
        <h3>Золотая Волна<br>ждёт тебя</h3>
        <p>Персональный поток под настроение</p>
        <button class="banner-btn" onclick="openWave()">Поехали</button>
      </div>
      <div class="banner-art">✧</div>
    </div>
    <div class="sec">
      <div class="sec-title">Рекомендации</div>
      <div class="row" id="recRow"></div>
    </div>
    <div class="sec">
      <div class="sec-title">Треки</div>
      <div id="list"></div>
    </div>`;

  const lr = document.getElementById('likedRow');
  if (likedT.length) {
    likedT.forEach(t => {
      const i = tracks.indexOf(t);
      lr.innerHTML += `<div class="card" onclick="play(${i})"><div class="card-img"><img src="${t.cover}" onerror="this.style.opacity=0"></div><div class="card-title">${t.title}</div><div class="card-sub">${t.artist}</div></div>`;
    });
  } else lr.innerHTML = '<div style="color:var(--muted);font-size:14px;padding:12px 0">Лайкай треки ♡</div>';

  const rr = document.getElementById('recRow');
  tracks.slice(0,8).forEach((t,i) => {
    rr.innerHTML += `<div class="card" onclick="play(${i})"><div class="card-img"><img src="${t.cover}" loading="lazy" onerror="this.style.opacity=0"></div><div class="card-title">${t.title}</div><div class="card-sub">${t.artist}</div></div>`;
  });

  const list = document.getElementById('list');
  tracks.forEach((t,i) => {
    list.innerHTML += `<div class="trow" onclick="play(${i})"><img src="${t.cover}" onerror="this.style.opacity=0"><div class="info"><div class="name">${t.title}</div><div class="art">${t.artist}</div></div></div>`;
  });
}

function collection() {
  const likedT = tracks.filter(t => liked.includes(t.id));
  screen.innerHTML = `
    <div class="hdr"><button class="hdr-btn">☺</button><h1>Коллекция</h1><button class="hdr-btn">⌕</button></div>
    <div class="col-heart">💜</div>
    <div class="col-title">Моя волна по коллекции</div>
    <div class="col-sub">У вашей музыки есть цвет</div>
    <div class="like-block">
      <div class="like-ico">♥</div>
      <div><div style="font-size:16px;font-weight:600">Мне нравится</div><div style="font-size:13px;color:var(--muted)">${likedT.length} треков</div></div>
    </div>
    <div style="padding:0 16px">
      ${likedT.length ? likedT.map(t => {
        const i = tracks.indexOf(t);
        return `<div class="trow" onclick="play(${i})"><img src="${t.cover}"><div class="info"><div class="name">${t.title}</div><div class="art">${t.artist}</div></div></div>`;
      }).join('') : '<p style="text-align:center;color:var(--muted);padding:40px 0">Пока пусто</p>'}
    </div>`;
}

function profile() {
  screen.innerHTML = `
    <div class="hdr"><button class="hdr-btn">←</button><h1>Профиль</h1><div style="width:32px"></div></div>
    <div class="av">R</div>
    <div class="pname">ravilrrrrrrr</div>
    <div class="psub">R&Music</div>
    <div class="mitem"><span>Управлять подпиской</span><span>›</span></div>
    <div class="mitem"><span>Настройки</span><span>›</span></div>
    <div class="mitem"><span>О приложении</span><span>›</span></div>`;
}

function play(i) {
  if (i < 0 || i >= tracks.length) return;
  idx = i;
  const t = tracks[i];
  pTitle.textContent = t.title;
  pArtist.textContent = t.artist;
  pCover.src = t.cover;
  player.classList.add('show');
  pLike.textContent = liked.includes(t.id) ? '♥' : '♡';
  pLike.classList.toggle('liked', liked.includes(t.id));
  waveTrack.textContent = t.artist + ' — ' + t.title;
  audio.src = t.url;
  audio.play().then(() => {
    playing = true;
    pPlay.textContent = '⏸';
    waveBtn.textContent = '⏸';
  }).catch(()=>{});
}

function toggle() {
  if (idx < 0) { play(0); return; }
  if (playing) {
    audio.pause(); playing = false;
    pPlay.textContent = '▶'; waveBtn.textContent = '▶';
  } else {
    audio.play(); playing = true;
    pPlay.textContent = '⏸'; waveBtn.textContent = '⏸';
  }
}

function openWave() {
  wave.classList.add('on');
  if (idx < 0) play(Math.floor(Math.random()*tracks.length));
  else if (!playing) toggle();
}

function toggleLike() {
  if (idx < 0) return;
  const id = tracks[idx].id;
  if (liked.includes(id)) liked = liked.filter(x => x !== id);
  else liked.push(id);
  localStorage.setItem('rm_liked', JSON.stringify(liked));
  pLike.textContent = liked.includes(id) ? '♥' : '♡';
  pLike.classList.toggle('liked', liked.includes(id));
}

audio.addEventListener('ended', () => play((idx+1) % tracks.length));
pPlay.onclick = e => { e.stopPropagation(); toggle(); };
pLike.onclick = e => { e.stopPropagation(); toggleLike(); };
waveBtn.onclick = toggle;
document.getElementById('waveBack').onclick = () => wave.classList.remove('on');

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    tab.classList.add('on');
    const n = tab.dataset.t;
    if (n === 'home') home();
    else if (n === 'wave') openWave();
    else if (n === 'col') collection();
    else if (n === 'prof') profile();
  };
});

home();
</script>
</body>
</html>
