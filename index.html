<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R&Music</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icon">♪</span>
        <span class="logo-text">R&Music</span>
      </div>

      <nav class="nav">
        <a href="#" class="nav-item active" data-section="home">
          <span class="nav-icon">⌂</span> Главная
        </a>
        <a href="#" class="nav-item" data-section="wave">
          <span class="nav-icon">✧</span> Золотая Волна
        </a>
        <a href="#" class="nav-item" data-section="collection">
          <span class="nav-icon">♥</span> Коллекция
        </a>
        <a href="#" class="nav-item" data-section="playlists">
          <span class="nav-icon">☰</span> Плейлисты
        </a>
        <a href="#" class="nav-item" data-section="search">
          <span class="nav-icon">⌕</span> Поиск
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="btn-add-music" id="addMusicBtn">+ Добавить музыку</button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="header">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Трек, альбом или исполнитель..." />
        </div>
        <div class="user">
          <div class="avatar">R</div>
        </div>
      </header>

      <div class="content" id="content">
        <!-- Dynamic content -->
      </div>
    </main>

    <!-- Player -->
    <footer class="player" id="player">
      <div class="player-track">
        <div class="track-cover" id="playerCover"></div>
        <div class="track-info">
          <div class="track-title" id="playerTitle">Выбери трек</div>
          <div class="track-artist" id="playerArtist">—</div>
        </div>
        <button class="like-btn" id="likeBtn">♡</button>
      </div>

      <div class="player-controls">
        <div class="controls-top">
          <button class="ctrl-btn" id="shuffleBtn">⇄</button>
          <button class="ctrl-btn" id="prevBtn">⏮</button>
          <button class="ctrl-btn play-btn" id="playBtn">▶</button>
          <button class="ctrl-btn" id="nextBtn">⏭</button>
          <button class="ctrl-btn" id="repeatBtn">↻</button>
        </div>
        <div class="progress">
          <span class="time" id="currentTime">0:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time" id="duration">0:00</span>
        </div>
      </div>

      <div class="player-extra">
        <button class="ctrl-btn" id="volumeBtn">🔊</button>
        <input type="range" id="volume" min="0" max="100" value="80" />
      </div>
    </footer>
  </div>

  <!-- Modal: Add Music -->
  <div class="modal" id="addMusicModal">
    <div class="modal-content">
      <h2>Добавить трек</h2>
      <input type="text" id="newTitle" placeholder="Название трека" />
      <input type="text" id="newArtist" placeholder="Исполнитель" />
      <input type="text" id="newCover" placeholder="URL обложки (необязательно)" />
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelAdd">Отмена</button>
        <button class="btn-confirm" id="confirmAdd">Добавить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
